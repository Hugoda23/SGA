version: "3.9"

# ============================================================
# Sistema de Gestión Académica (SGA)
# Arquitectura Headless: Laravel API + React + PostgreSQL
# ============================================================

services:

  # ----------------------------------------------------------
  # Base de datos PostgreSQL con soporte JSONB nativo
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: sga_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sga_db}
      POSTGRES_USER: ${DB_USERNAME:-sga_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sga_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - sga_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sga_user} -d ${DB_DATABASE:-sga_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # PHP-FPM: Runtime de Laravel (API RESTful)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: sga_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      APP_NAME: "SGA"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: http://localhost:8081
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sga_db}
      DB_USERNAME: ${DB_USERNAME:-sga_user}
      DB_PASSWORD: ${DB_PASSWORD:-sga_secret}
      CORS_ALLOWED_ORIGINS: "http://localhost:3002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sga_network

  # ----------------------------------------------------------
  # Nginx: Reverse proxy y servidor web para Laravel
  # ----------------------------------------------------------
  webserver:
    image: nginx:1.25-alpine
    container_name: sga_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - sga_network

  # ----------------------------------------------------------
  # Node.js: Servidor de desarrollo Vite (React + Tailwind)
  # ----------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: sga_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3002:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8081/api
    networks:
      - sga_network

# ----------------------------------------------------------
# Redes y volúmenes
# ----------------------------------------------------------
networks:
  sga_network:
    driver: bridge

volumes:
  pgdata:
    name: sga_pgdata
