version: "3.9"

# ============================================================
# Sistema de Gestión Académica (SGA)
# Arquitectura Headless: Laravel API + React + PostgreSQL
# ============================================================

# Variables de entorno compartidas por los contenedores que corren código
# Laravel (backend, queue-worker, scheduler).
x-backend-env: &backend-env
  APP_NAME: "SGA"
  APP_ENV: "${APP_ENV:-local}"
  APP_KEY: "${APP_KEY:-}"
  APP_DEBUG: "${APP_DEBUG:-true}"
  APP_URL: http://localhost:8081
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-sga_db}
  DB_USERNAME: ${DB_USERNAME:-sga_user}
  DB_PASSWORD: ${DB_PASSWORD:-sga_secret}
  # Incluye la IP de LAN de esta máquina para poder probar el sistema
  # desde otros dispositivos en la misma red antes de pasar a
  # producción — si la IP de la máquina cambia, actualizar aquí.
  CORS_ALLOWED_ORIGINS: "http://localhost:3002,http://localhost:8081,http://192.168.1.106:3002,http://192.168.1.106:8081"
  QUEUE_CONNECTION: database

services:

  # ----------------------------------------------------------
  # Base de datos PostgreSQL con soporte JSONB nativo
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: sga_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sga_db}
      POSTGRES_USER: ${DB_USERNAME:-sga_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sga_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - sga_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sga_user} -d ${DB_DATABASE:-sga_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # PHP-FPM: Runtime de Laravel (API RESTful)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: sga_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sga_network

  # ----------------------------------------------------------
  # Procesa la cola (envío de notificaciones push, jobs en general).
  # Sin este contenedor, todo lo despachado con ShouldQueue se queda
  # sentado en la tabla "jobs" y nunca se envía.
  # ----------------------------------------------------------
  queue-worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: sga_queue_worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment: *backend-env
    command: sh -c "php artisan queue:listen --tries=3 --timeout=0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sga_network

  # ----------------------------------------------------------
  # Dispara el scheduler de Laravel (routes/console.php) cada minuto —
  # de ahí sale "sga:generar-notificaciones" a las 6:00 AM.
  # ----------------------------------------------------------
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: sga_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment: *backend-env
    command: sh -c "while :; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sga_network

  # ----------------------------------------------------------
  # Nginx: Reverse proxy y servidor web para Laravel
  # ----------------------------------------------------------
  webserver:
    image: nginx:1.25-alpine
    container_name: sga_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - sga_network

  # ----------------------------------------------------------
  # Node.js: Servidor de desarrollo Vite (React + Tailwind)
  # ----------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: sga_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3002:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      # IP de LAN de esta máquina, para poder probar el sistema desde otros
      # dispositivos en la misma red antes de pasar a producción — si la IP
      # de la máquina cambia, actualizar aquí.
      - VITE_API_URL=http://192.168.1.106:8081/api
      # Clave pública VAPID (ver backend/.env, VAPID_PUBLIC_KEY) — la privada
      # nunca sale del backend.
      - VITE_VAPID_PUBLIC_KEY=BF1uhqkdXs4a_H7TC0mPzPnvXb3KcZU3yJ1guvVzoT_XeiNnJWpQSAcJ3QgdarkBLtrww7ub2ceNbR-2l3vUJc4
    networks:
      - sga_network

# ----------------------------------------------------------
# Redes y volúmenes
# ----------------------------------------------------------
networks:
  sga_network:
    driver: bridge

volumes:
  pgdata:
    name: sga_pgdata
