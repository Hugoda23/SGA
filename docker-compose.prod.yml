# ============================================================
# Sistema de Gestión Académica (SGA) — Producción
#
# Diferencias clave respecto a docker-compose.yml (desarrollo):
#   - El backend corre desde una imagen con el código y las
#     dependencias ya instaladas (Dockerfile.prod), no desde un
#     bind-mount del host.
#   - El frontend se compila una sola vez a estáticos (Dockerfile.prod
#     del frontend) y Nginx los sirve directamente — no hay servidor
#     de desarrollo de Vite corriendo en producción.
#   - Solo "webserver" expone puertos a la red pública (80/443).
#     db y backend son solo alcanzables dentro de la red interna.
#   - APP_DEBUG=false, variables sensibles vienen de .env.production
#     (ver .env.production.example — nunca commitear el real).
#
# Uso (ver guía completa "Despliegue en producción (VPS)" en el README):
#   docker compose -f docker-compose.prod.yml --env-file .env.production \
#     --profile build run --rm frontend-build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d db backend webserver
# ============================================================

# Variables de entorno compartidas por los tres contenedores que corren
# código Laravel (backend, queue-worker, scheduler) — deben ver la misma
# configuración de BD, Sanctum y VAPID.
x-backend-env: &backend-env
  APP_NAME: "${APP_NAME:-Instituto Florencio Carrascoza}"
  APP_ENV: production
  APP_KEY: "${APP_KEY}"
  APP_DEBUG: "false"
  APP_URL: "${APP_URL}"
  LOG_LEVEL: "${LOG_LEVEL:-warning}"
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
  SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS}"
  SANCTUM_EXPIRATION: "${SANCTUM_EXPIRATION:-43200}"
  VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
  VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
  VAPID_SUBJECT: "${VAPID_SUBJECT}"
  QUEUE_CONNECTION: database

services:
  db:
    image: postgres:16-alpine
    container_name: sga_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - sga_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin "ports": la BD solo es alcanzable dentro de la red de Docker,
    # nunca expuesta directamente a Internet.

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile.prod
    container_name: sga_backend_prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Los archivos que el backend guarda como públicos (storage:link)
      # viven en un volumen compartido con Nginx, montado directamente
      # en public/storage — evita depender de un symlink cruzado entre
      # contenedores distintos.
      - backend_storage:/var/www/html/storage/app/public
    environment: *backend-env
    command: >
      sh -c "php artisan migrate --force &&
             php artisan config:cache &&
             php artisan route:cache &&
             php artisan view:cache &&
             php-fpm"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sga_network

  # Procesa la cola (envío de notificaciones push, jobs en general).
  # Sin este contenedor, todo lo despachado con ShouldQueue se queda
  # sentado en la tabla "jobs" y nunca se envía.
  queue-worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile.prod
    container_name: sga_queue_worker_prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    environment: *backend-env
    command: sh -c "php artisan queue:work --sleep=3 --tries=3 --max-time=3600"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - sga_network

  # Dispara el scheduler de Laravel (routes/console.php) cada minuto —
  # de ahí sale "sga:generar-notificaciones" a las 6:00 AM.
  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile.prod
    container_name: sga_scheduler_prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    environment: *backend-env
    command: sh -c "while :; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - sga_network

  webserver:
    image: nginx:1.25-alpine
    container_name: sga_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/public:/var/www/backend/public:ro
      - backend_storage:/var/www/backend/public/storage:ro
      - frontend_dist:/var/www/frontend:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - sga_network

  # Build de un solo uso: compila el frontend y deja dist/ en el volumen
  # frontend_dist para que "webserver" lo sirva. No corre en segundo plano.
  # Ejecutar con: docker compose -f docker-compose.prod.yml --profile build run --rm frontend-build
  #
  # El volumen se monta en /dist y NO en /app/dist (que es donde la imagen
  # dejó el build): Docker solo copia el contenido de la imagen a un volumen
  # nombrado cuando ese volumen está vacío, así que montarlo sobre /app/dist
  # tapaba el build nuevo en cada despliegue posterior al primero y el
  # frontend se quedaba congelado. Copiando explícitamente de /app/dist a
  # /dist el artefacto se renueva siempre; el rm previo limpia los assets
  # con hash viejo, que si no se irían acumulando en el volumen.
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      target: build
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    container_name: sga_frontend_build
    volumes:
      - frontend_dist:/dist
    command: ["sh", "-c", "rm -rf /dist/* /dist/.[!.]* 2>/dev/null; cp -a /app/dist/. /dist/"]
    profiles: ["build"]

  # Renovación automática del certificado SSL (Let's Encrypt).
  # La emisión inicial del certificado es un comando aparte, ver README.
  # Ejecutar con: docker compose -f docker-compose.prod.yml --profile certbot up -d certbot
  certbot:
    image: certbot/certbot
    container_name: sga_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    profiles: ["certbot"]

networks:
  sga_network:
    driver: bridge

volumes:
  pgdata_prod:
    name: sga_pgdata_prod
  backend_storage:
    name: sga_backend_storage_prod
  frontend_dist:
    name: sga_frontend_dist_prod
  certbot_conf:
    name: sga_certbot_conf
  certbot_www:
    name: sga_certbot_www
