# ============================================================
# Nginx de producción: sirve el frontend (SPA estático) y la API
# de Laravel desde el mismo dominio, con TLS (Let's Encrypt/certbot).
#
# Antes de usar este archivo, reemplazar TODAS las apariciones de
# "tudominio.com" por el dominio real, y ver la guía de despliegue
# en el README ("Despliegue en producción (VPS)") para el flujo
# completo de emisión de certificado.
# ============================================================

server {
    listen 80;
    server_name tudominio.com;

    # Requerido por certbot (método webroot) para validar el dominio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'" always;

    # ---- API Laravel (backend/public sirve como front controller) ----
    # Todo bajo /api va siempre al front controller de Laravel — nunca hay
    # archivos estáticos reales ahí, así que no hace falta (ni conviene)
    # try_files con una location anidada: ese patrón hace una redirección
    # interna para llegar al bloque ~ \.php$, y en la práctica se vieron
    # peticiones POST (login, etc.) devueltas con 405 directamente por
    # Nginx, sin llegar nunca a PHP-FPM. "rewrite ... break" reescribe la
    # ruta sin volver a evaluar los "location" (a diferencia de try_files
    # o "rewrite ... last"), evitando ese problema.
    location /api {
        rewrite ^ /index.php break;

        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Ruta real de index.php DENTRO del contenedor "backend" (WORKDIR de
        # Dockerfile.prod) — no la del bind-mount de solo lectura que usa
        # este contenedor de Nginx para servir /storage, que es distinta.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Archivos públicos subidos por Laravel (storage:link) — nunca ejecutar PHP ahí.
    location ~ ^/storage/.*\.php$ {
        deny all;
    }

    location /storage {
        root /var/www/backend/public;
    }

    # ---- Frontend (SPA construido con `npm run build`) ----
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
        gzip_static on;
    }

    location ~ /\. {
        deny all;
    }
}
