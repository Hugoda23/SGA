# ============================================================
# Nginx — Configuración para Laravel API (SGA)
# Actúa como reverse proxy hacia PHP-FPM
# ============================================================
server {
    listen 80;
    index index.php index.html;

    # Logs
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Límite de tamaño de subida (debe coincidir con PHP upload_max_filesize/post_max_size = 100M)
    client_max_body_size 100M;

    # Raíz del proyecto Laravel
    root /var/www/html/public;

    # CORS manejado por Laravel (HandleCors middleware)

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Nunca ejecutar PHP dentro de storage/ (uploads vía symlink public/storage)
    location ~ ^/storage/.*\.php$ {
        deny all;
    }

    # Procesamiento de archivos PHP via PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}
